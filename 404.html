<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f2f4f8">
    <title>Page not found | VORVENA</title>

    <style>
        :root {
            --navy: #082b68;
            --blue: #2464bd;
            --text: #4b5563;
            --heading: #374151;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { font-size: 100%; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f2f4f8;
            color: var(--text);
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        .notice {
            width: 100%;
            max-width: 28rem;
        }

        .icon {
            display: block;
            width: 7rem;
            height: auto;
            margin: 0 auto 1.6rem;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--heading);
            margin-bottom: 0.4rem;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text);
            margin: 0 auto 1.6rem;
            max-width: 25rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 10.5rem;
            min-height: 2.9rem;
            padding: 0 1.8rem;
            border-radius: 0.5rem;
            background: var(--navy);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        .btn-home:hover { background: var(--blue); }

        .btn-help {
            display: block;
            width: fit-content;
            margin: 0.9rem auto 0;
            padding: 0.4rem 0.8rem;
            color: var(--blue);
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 0.4rem;
        }

        .btn-help:hover { text-decoration: underline; }

        .btn-home:focus-visible,
        .btn-help:focus-visible {
            outline: 3px solid rgba(36, 100, 189, 0.45);
            outline-offset: 2px;
        }

        .brand {
            margin-top: 3rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #9aa5b8;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <main class="notice">

        <!-- Page with a padlock, like the reference, in VORVENA blues -->
        <svg class="icon" viewBox="0 0 120 120" role="img" aria-label="Page not available">
            <path d="M44 8h40l28 28v70a6 6 0 0 1-6 6H44a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="#9cc3ff"/>
            <path d="M84 8l28 28H90a6 6 0 0 1-6-6V8z" fill="#2464bd"/>
            <path d="M26 56v-8a14 14 0 0 1 28 0v8h-8v-8a6 6 0 0 0-12 0v8h-8z" fill="#a8adb5"/>
            <rect x="10" y="54" width="52" height="40" rx="5" fill="#666a72"/>
            <circle cx="36" cy="70" r="5" fill="#111"/>
            <rect x="34" y="72" width="4" height="12" rx="2" fill="#111"/>
        </svg>

        <h1>This page isn't available right now</h1>

        <p>When this happens, it's usually because the link is broken, the page has moved, or it's been removed.</p>

        <a href="/index.html" class="btn-home">Back to home</a>
        <a href="/contact-support.html" class="btn-help">Visit Help Center</a>

    </main>

    <div class="brand">VORVENA.</div>

</body>
</html>
