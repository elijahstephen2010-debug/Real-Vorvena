
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VORVENA</title>

    <link rel="stylesheet" href="login.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-header">
                <a href="index.html" class="logo">VORVENA</a>
                <h1>Welcome back</h1>
                <p>Sign in to continue to your account.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="login-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>

                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <p id="loginMessage" class="login-message" role="alert"></p>

                <button type="submit" id="loginButton" class="login-btn">
                    Sign In
                </button>

            </form>

            <div class="login-divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button type="button" id="googleLogin" class="social-btn">
                    <i class="fa-brands fa-google"></i>
                    Continue with Google
                </button>

                <button type="button" id="appleLogin" class="social-btn">
                    <i class="fa-brands fa-apple"></i>
                    Continue with Apple
                </button>
            </div>

            <p class="signup-link">
                Don't have an account?
                <a href="professional-signup.html">Create an account</a>
            </p>

        </div>

    </main>

    <script>
    document.addEventListener("DOMContentLoaded", function () {

        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = document.getElementById("loginButton");
        const togglePassword = document.getElementById("togglePassword");

        function showMessage(message, type = "error") {
            loginMessage.textContent = message;
            loginMessage.style.color = type === "success" ? "#16803c" : "#d93025";
        }

        // Show or hide password
        togglePassword.addEventListener("click", function () {
            const isPassword = passwordInput.type === "password";

            passwordInput.type = isPassword ? "text" : "password";

            this.innerHTML = isPassword
                ? '<i class="fa-regular fa-eye-slash"></i>'
                : '<i class="fa-regular fa-eye"></i>';
        });

        // Login
        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("Please enter your email and password.");
                return;
            }

            const savedEmail = sessionStorage.getItem("vorvenaEmail");
            const accountType = sessionStorage.getItem("vorvenaAccountType");

            if (!savedEmail) {
                showMessage("No registered account found. Please sign up first.");
                return;
            }

            if (email !== savedEmail.toLowerCase()) {
                showMessage("This email does not match your registered account.");
                return;
            }

            if (accountType !== "professional") {
                showMessage("Client dashboard is not connected yet.");
                return;
            }

            let profile;

            try {
                profile = JSON.parse(
                    sessionStorage.getItem("vorvenaProfessionalProfile") ||
                    localStorage.getItem("vorvenaProfessionalProfile") ||
                    "null"
                );
            } catch (error) {
                showMessage("Your profile information could not be loaded.");
                return;
            }

            if (!profile || profile.onboardingStatus !== "demo-completed") {
                showMessage("Please complete your professional onboarding first.");
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            sessionStorage.setItem("vorvenaLoggedIn", "true");
            sessionStorage.setItem("vorvenaLoggedInEmail", email);
            sessionStorage.setItem("vorvenaLoggedInRole", "professional");

            showMessage("Login successful. Redirecting...", "success");

            setTimeout(function () {
                window.location.href = "professional-dashboard.html";
            }, 700);
        });

        // Forgot password placeholder
        document.getElementById("forgotPassword").addEventListener("click", function (event) {
            event.preventDefault();
            showMessage("Password recovery will be available when the backend is connected.");
        });

        // Social login placeholders
        document.getElementById("googleLogin").addEventListener("click", function () {
            showMessage("Google sign-in is not connected yet.");
        });

        document.getElementById("appleLogin").addEventListener("click", function () {
            showMessage("Apple sign-in is not connected yet.");
        });

    });
    </script>

</body>
</html>
